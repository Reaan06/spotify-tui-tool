[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-tui-tool"
version = "0.1.0"
description = "Textual TUI for controlling SpotX-patched Spotify via playerctl/MPRIS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.52",
    "rich>=13.7",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
spotify-tui-tool = "spotify_tui_tool.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
